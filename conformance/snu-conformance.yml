notes: >-
  The two conformances that matter here are the two nobody had catalogued: an OAI-PMH
  data provider SNU actually runs (two of them), and a SAML identity provider that is
  registered in eduGAIN and therefore machine-readable by definition. Neither is a vendor
  contract wearing SNU's name — the OAI endpoints answer from SNU's own address block
  with SNU's own admin contacts, and the IdP's certificates are issued to SNU's own
  Information Systems and Technology office.
