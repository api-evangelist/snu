source: >-
  Live probes on 2026-08-19 of s-space.snu.ac.kr/oai/*, kossda.snu.ac.kr/oai/*,
  s-space.snu.ac.kr/open-search/*, and the eduGAIN aggregate metadata at
  https://mds.edugain.org/edugain-v2.xml (10,566 entities; one carries the snu.ac.kr
