versioning:
  scheme: protocol-version
  mechanism: >-
    None of SNU's surfaces are versioned by SNU. Each is pinned to the version of the
    protocol it implements — OAI-PMH 2.0, OpenSearch 1.1, SAML 2.0 — and the only version
    that moves is the version of the software underneath it, which SNU does not announce.
  docs: null
  notes: >-
    There is no API version header, no version path segment, and no published version
    policy on any SNU surface. A consumer's only version signal is the `<meta
    name="Generator">` tag the repository software emits.
software_versions:
  - surface: S-Space
    host: s-space.snu.ac.kr
    software: DSpace 5.5
    evidence: '<meta name="Generator" content="DSpace 5.5"/> in the served HTML, 2026-08-19'
    note: >-
      DSpace 5.5 was released in 2016 and is long out of support upstream; DSpace 7 and 8
      have shipped since. This matters to an integrator: the DSpace 7 REST API
      (/server/api) that most current DSpace tooling targets does not exist here, and the
      repository's only programmable surfaces are the 5.x-era OAI-PMH and OpenSearch ones.
  - surface: KOSSDA
    host: kossda.snu.ac.kr
