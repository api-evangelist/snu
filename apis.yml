- aid: snu:kafe-saml-idp
  name: Seoul National University SAML 2.0 Identity Provider
  x-operator: institution
  description: >-
    SNU's federated identity provider, entityID https://kafegw.snu.ac.kr/idp/simplesamlphp, registered
    by the Korea Access Federation (registrationAuthority http://kafe.kreonet.net, registrationInstant
    2024-06-25) and exported into eduGAIN, where exactly one of 10,566 entities carries the snu.ac.kr
    scope. SimpleSAMLphp, SAML 2.0, SSO and SLO over HTTP-Redirect and HTTP-POST, transient NameID, separate
    signing and encryption certificates issued to CN=kafegw.snu.ac.kr, O=SNU, OU=Information Systems and
    Technology, valid to 2028-06-03. Declares shibmd:Scope snu.ac.kr, supports REFEDS Research & Scholarship,
    and asserts Sirtfi with a published security contact. Institution-operated by definition and machine-readable
    by definition — and not previously catalogued. Note that SNU does not serve its own metadata: the
    entityID URL 404s and the SimpleSAMLphp metadata path returns 500, so the eduGAIN aggregate is the
    only retrievable copy, mirrored here.
