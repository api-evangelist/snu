x-coverage:
  state: covered
  reason: institution_operates_limited_public_surface
  detail: >-
    Not blocked and not thin by accident. Seventy-plus URLs across snu.ac.kr and its
    subdomains were probed on 2026-08-19, in Korean as well as English, and four
    institution-operated machine-readable surfaces were found and verified: two OAI-PMH
    2.0 repositories, one OpenSearch 1.1 interface, one SAML 2.0 identity provider in
    eduGAIN. The negatives are as load-bearing as the positives. api.snu.ac.kr exists and
    resolves to SNU's block but answers 403 at the root and 404 on every path, so it is
    not a gateway. There is no open-data portal — data.snu.ac.kr is a research lab's
    website, not CKAN or Socrata. The LMS at etl.snu.ac.kr is neither Moodle nor Canvas
    and exposes no LTI. dcollection.snu.ac.kr runs KERIS dCollection on SNU's own network
    but serves no OAI-PMH. There is no official SNU GitHub organization, only lab-level
    ones, so no GitHubOrganization pointer is claimed. Two access conditions shape what a
    machine can actually reach: s-space and kossda front everything except OAI-PMH with a
    JavaScript challenge returning HTTP 200 and an HTML shell, and lib.snu.ac.kr locks its
    WordPress REST API behind a 401. One correction to the 2026-06-03 profile is recorded
    in errors/snu-errors.yml — the DSpace REST API previously reported as "present but
    403" does not exist at all; behind the challenge cookie those paths 404.
  evidence:
    - url: https://s-space.snu.ac.kr/oai/request?verb=Identify
      status: 200
      note: OAI-PMH 2.0 Identify, anonymous, no challenge. repositoryName "SNU Open Repository and Archive".
    - url: https://s-space.snu.ac.kr/oai/request?verb=ListMetadataFormats
      status: 200
      note: Twelve metadata formats.
    - url: https://s-space.snu.ac.kr/oai/request?verb=ListSets
      status: 200
      note: Over 100 sets (com_10371_*, col_10371_*).
    - url: https://s-space.snu.ac.kr/oai/openaire?verb=Identify
      status: 200
      note: OpenAIRE harvesting context, live.
    - url: https://s-space.snu.ac.kr/oai/driver?verb=Identify
      status: 200
      note: DRIVER harvesting context, live.
    - url: https://kossda.snu.ac.kr/oai/request?verb=Identify
      status: 200
      note: KOSSDA OAI-PMH live; required a 120s read timeout, failed at 30s and 45s.
    - url: https://mds.edugain.org/edugain-v2.xml
      status: 200
      note: >-
        eduGAIN aggregate, 92.9 MB, 10,566 entities. Exactly one carries scope snu.ac.kr —
        SNU's SAML 2.0 IdP. Mirrored to authentication/snu-kafe-saml-idp-metadata.xml.
    - url: https://kafegw.snu.ac.kr/
      status: 200
      note: IdP host live on 147.46.10.201, SNU's own address block.
    - url: https://kafegw.snu.ac.kr/saml/module.php/saml/idp/metadata.php
      status: 500
      note: SNU does not serve its own SAML metadata; only the federation aggregate has it.
    - url: https://kafegw.snu.ac.kr/idp/simplesamlphp
      status: 404
      note: The published entityID is not dereferenceable.
    - url: https://s-space.snu.ac.kr/open-search/description.xml
      status: 200
      note: >-
        OpenSearch 1.1 description — but only with the js-challenge cookie replayed.
        Cold, this same 200 returns a 1,004-byte HTML challenge shell. Soft-200.
    - url: https://s-space.snu.ac.kr/rest
      status: 404
      note: >-
        Behind the challenge cookie. Corrects the 2026-06-03 finding of 403 — no DSpace
        REST API is deployed, and the 403 was the bot challenge, not an access control.
    - url: https://s-space.snu.ac.kr/server/api
      status: 404
      note: DSpace 7 REST path absent; this is DSpace 5.5.
    - url: https://api.snu.ac.kr/
      status: 403
      note: Host exists on SNU's block; 404 on /v1, /api, /docs, /swagger, /health, /openapi.json, /status. Not a gateway.
    - url: https://data.snu.ac.kr/
      status: 200
      note: Data Science & AI Laboratory website. Not an open-data portal — do not read the hostname as one.
    - url: https://etl.snu.ac.kr/mod/lti/token.php
      status: 404
      note: LMS is not Moodle and exposes no LTI; /theme/ and /local/ return soft-404s with the same 850-byte body.
    - url: https://dcollection.snu.ac.kr/oai/request?verb=Identify
      status: 200
      note: Soft-404 — returns the dCollection HTML page, not OAI-PMH XML. No harvesting surface here.
    - url: https://lib.snu.ac.kr/wp-json/
      status: 401
      note: WordPress REST API present but locked (rest_not_logged_in). Gated, not public.
    - url: https://www.snu.ac.kr/robots.txt
      status: 200
      note: Blocks 20+ named crawlers including Applebot and Amazonbot; no llms.txt (404) and no security.txt (404).
    - url: https://api.datacite.org/providers?query=Seoul%20National%20University
      status: 200
      note: Zero results. SNU is not a DataCite member; repositories mint Handles, not DOIs.
    - url: https://api.github.com/orgs/snu
      status: 404
      note: No official SNU GitHub organization; only lab-level orgs exist.
