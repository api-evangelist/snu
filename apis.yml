description: >-
  Seoul National University (SNU) is South Korea's flagship national research university,
  a national university corporation in Seoul ranked in the QS World top 40 and identified
  by ROR as https://ror.org/04h9pn542. Like most universities it is a federation of
  buyers rather than a producer of APIs: it operates no developer portal, no open-data
  portal, no API gateway, no official GitHub organization, and no OAuth or OIDC
  authorization server. It publishes no API documentation of any kind, and every contract
  in this repository was written from live probing rather than from something SNU wrote.

  What it does operate — verified on its own hosts and its own address block on
  2026-08-19 — is four machine-readable surfaces. Two OAI-PMH 2.0 data providers: S-Space,
  the SNU Open Repository and Archive (DSpace 5.5, content from 2008, twelve metadata
  formats, 100+ sets, three harvesting contexts including OpenAIRE and DRIVER), and
  KOSSDA, the Korea Social Science Data Archive (DSpace 5.6, content from 2017). An
  OpenSearch 1.1 search interface over S-Space. And a SAML 2.0 Identity Provider,
  entityID https://kafegw.snu.ac.kr/idp/simplesamlphp, registered in the KAFE national
  federation and exported into eduGAIN with REFEDS Research & Scholarship support and a
  Sirtfi assurance assertion — the single most consequential programmable surface the
  institution runs, and one no catalog had recorded.

  Two honest limits belong in the same breath. The repository hosts front everything
  except OAI-PMH with a JavaScript bot challenge that returns HTTP 200 and an HTML shell
  to any machine client, so the OpenSearch interface is gated rather than open. And SNU's
  library discovery runs on Ex Libris Alma and Primo under institution code 82SNU — real,
  but a tenancy, recorded below as such and never scored as SNU's engineering.
